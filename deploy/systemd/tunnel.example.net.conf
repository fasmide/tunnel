# Deployment-specific transport mode for tunnel.example.net.
# Install as /etc/systemd/system/tunneld.service.d/transport.conf.
[Service]
LoadCredential=
ExecStart=
ExecStart=/usr/local/bin/tunneld --state ${STATE_DIRECTORY} --socket ${RUNTIME_DIRECTORY}/admin.sock --domain tunnel.example.net --quic :7443 --https :443 --http :80
